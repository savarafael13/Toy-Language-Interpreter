plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Compile against the Java 25 API/language level regardless of which JDK runs Gradle.
// §1.4 asks for JDK 25; this pins the source level without needing a JDK 25 install.
tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

application {
    mainClass = 'interpreter.Main'
}

tasks.named('run') {
    standardInput = System.in
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
    }
}